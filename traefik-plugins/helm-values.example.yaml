# Traefik(Helm の chart traefik)に、launchs のプラグインを入れるための values の例。
# 手順は docs/ingress-plugins.md §8。試験用の Traefik(namespace plugin-test)で、同じ作りで動くことを確認済み。
#
# 1. プラグインのソースを、ConfigMap にする(ソースを変えたら、作り直して、Traefik を再起動する):
#    kubectl -n traefik create configmap plugin-launchs-edge \
#      --from-file=launchs-edge/edge.go --from-file=launchs-edge/go.mod --from-file=.traefik.yml=launchs-edge/.traefik.yml
#    kubectl -n traefik create configmap plugin-launchs-stats \
#      --from-file=launchs-stats/stats.go --from-file=launchs-stats/topn.go --from-file=launchs-stats/path.go \
#      --from-file=launchs-stats/go.mod --from-file=.traefik.yml=launchs-stats/.traefik.yml
# 2. launchs-edge の Middleware を、Traefik の namespace に作る(下の edge-middleware.example.yaml)。
# 3. この values を足して、helm upgrade する(Traefik が再起動する)。

experimental:
  localPlugins:
    launchs-edge:
      moduleName: github.com/launchs-org/launchs-edge
    launchs-stats:
      moduleName: github.com/launchs-org/launchs-stats

# プラグインのソースを、Traefik が探す場所に置く。
deployment:
  additionalVolumes:
    - name: plugin-launchs-edge
      configMap:
        name: plugin-launchs-edge
    - name: plugin-launchs-stats
      configMap:
        name: plugin-launchs-stats

additionalVolumeMounts:
  - name: plugin-launchs-edge
    mountPath: /plugins-local/src/github.com/launchs-org/launchs-edge
  - name: plugin-launchs-stats
    mountPath: /plugins-local/src/github.com/launchs-org/launchs-stats

# launchs-edge は、全てのリクエストに掛ける(entryPoint の middleware)。<namespace>-<名前>@kubernetescrd の形で書く。
ports:
  web:
    http:
      middlewares:
        - traefik-launchs-edge@kubernetescrd
