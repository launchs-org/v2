# 開発環境の nginx の設定。
# HTTPS(自己署名の証明書)を終端して、コンテナネットワークの中のバックエンドへ、HTTP でプロキシする。
# バックエンドは、ホストには公開せず、この nginx だけが入り口になる。

# クライアントが X-Request-Id を付けていれば、それを使う。無ければ nginx が作る。
# バックエンドのログと、nginx のログを、同じ ID でたどれるようにするため。
map $http_x_request_id $forwarded_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# WebSocket の接続のとき(Vite の HMR)だけ、Connection: upgrade を渡す。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # アップロード(最大100MB)を通すため、上限を、バックエンドの上限より大きくしておく。
    # 上限の判定とエラーのレスポンスは、バックエンドに任せる(nginx の 413 は HTML になってしまう)。
    client_max_body_size 128m;

    # Docker のコンテナ名の解決に、Docker の DNS を使う。
    # バックエンドのコンテナが作り直されて IP が変わっても、リクエストのたびに引き直すので追従できる。
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 認証のコンテナ。パスは書き換えずに、そのまま渡す(認証のコンテナが /auth を付けたパスで受け付ける)。
    location /auth/ {
        set $auth_address http://auth:8080;
        proxy_pass $auth_address;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $forwarded_request_id;
    }

    # フロントエンド(Vite の開発サーバー)。/api と /auth 以外の、全てのパス。HMR の WebSocket も、ここを通る。
    location / {
        set $frontend_address http://frontend:5173;
        proxy_pass $frontend_address;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HMR の接続は、長く続くので、切られないようにする。
        proxy_read_timeout 1h;
    }

    # バックエンドの API とヘルスチェック。パスは書き換えずに、そのまま渡す。
    location ~ ^/(api/|healthz$) {
        # 変数に入れると、nginx の起動時ではなく、リクエストのたびに名前を引く。
        set $backend_address http://backend:8080;
        proxy_pass $backend_address;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $forwarded_request_id;
    }
}
