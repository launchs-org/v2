# 開発環境の nginx の設定。
# HTTPS(自己署名の証明書)を終端して、コンテナネットワークの中のバックエンドへ、HTTP でプロキシする。
# バックエンドは、ホストには公開せず、この nginx だけが入り口になる。

# クライアントが X-Request-Id を付けていれば、それを使う。無ければ nginx が作る。
# バックエンドのログと、nginx のログを、同じ ID でたどれるようにするため。
map $http_x_request_id $forwarded_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # アップロード(最大100MB)を通すため、上限を、バックエンドの上限より大きくしておく。
    # 上限の判定とエラーのレスポンスは、バックエンドに任せる(nginx の 413 は HTML になってしまう)。
    client_max_body_size 128m;

    # Docker のコンテナ名の解決に、Docker の DNS を使う。
    # バックエンドのコンテナが作り直されて IP が変わっても、リクエストのたびに引き直すので追従できる。
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        # 変数に入れると、nginx の起動時ではなく、リクエストのたびに名前を引く。
        set $backend_address http://backend:8080;
        proxy_pass $backend_address;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $forwarded_request_id;
    }
}
