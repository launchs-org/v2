# プルリクエストと develop への push(と、release.yml からの呼び出し)で、整形・静的解析・ビルド・テストを実行する。
name: test

on:
  pull_request:
  push:
    branches: [develop]
  # release.yml から呼ばれる(main に push されたとき、イメージを作る前に、同じテストを通す)。
  workflow_call:

# 同じブランチで新しい実行が始まったら、古い実行は止める。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # リポジトリのテストが使う PostgreSQL。テストごとに、使い捨てのデータベースを作る。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # shared/database/testdatabase が、使い捨てのデータベースを作るための接続先。
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4
        with:
          # templates/ は、別のリポジトリ(submodule)。--recursive にしない(その中の launchs/ が、この本体を指すため、終わらなくなる)。
          submodules: true
          # 別の非公開リポジトリ(templates)を取るため、読み取りの権限のある token を、secret TEMPLATES_TOKEN に入れる(無ければ、既定の token)。
          token: ${{ secrets.TEMPLATES_TOKEN || github.token }}

      # Go のバージョンは go.mod に合わせる。モジュールのキャッシュも自動で効く。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Traefik の values(プラグインのソースを含む)が、ソースと合っているか。ソースを変えたら、作り直して、コミットする。
      - name: Traefik の values がプラグインのソースと合っているか確認する
        run: python3 traefik-plugins/render_helm_values.py --check deploy/cluster/traefik-values.yaml

      - name: 整形されているか確認する(gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: 静的解析(go vet)
        run: go vet ./...

      - name: ビルド
        run: go build -o /dev/null ./...

      # 利用者向けのドキュメント(docs/)の生成ツールのテストと、リンク切れの検査(生成が失敗すれば、落ちる)。
      - name: ドキュメントの生成ツールのテストと、ドキュメントのビルド
        run: |
          cd tools/docsbuild
          go test ./...
          go run . -src ../../docs -templates ../../templates/templates -out /tmp/site

      # データベースを使うテストが、飛ばされずに実行されることを、-v の出力で確認する。
      - name: テスト
        # パイプの途中の go test が失敗したときに、ステップも失敗させる(pipefail。無いと、tee の終了コードで、緑になってしまう)。
        run: |
          set -o pipefail
          go test -v ./... | tee test-output.txt

      - name: データベースのテストが飛ばされていないか確認する
        run: |
          if grep -q -- "--- SKIP" test-output.txt; then
            echo "飛ばされたテストがある:"
            grep -- "--- SKIP" test-output.txt
            exit 1
          fi
