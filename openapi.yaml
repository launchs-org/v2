          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: ボリューム名変更 (即時反映)
      description: ボリュームの名前を変更します (即時反映)。
      tags: [Volumes]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/VolumeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameVolumeRequest'
      responses:
        '200':
          description: 変更完了
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: 名前重複または削除中
          $ref: '#/components/responses/ConflictError'
    delete:
      summary: ボリューム削除
      description: ボリュームを削除します (現在 Pod にマウント中の場合は削除不可)。
      tags: [Volumes]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/VolumeIdPath'
      responses:
        '200':
          description: 削除要求受付完了
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: マウント中または削除中の場合
          $ref: '#/components/responses/ConflictError'

  /api/v1/projects/{projectId}/volumes/{volumeId}/size:
    patch:
      summary: ボリューム拡張の下書き保存 (pending 保存)
      description: ボリューム容量の拡大を下書き (pending) として保存します (縮小は不可)。
      tags: [Volumes]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/VolumeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeVolumeRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 容量縮小または上限超過
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: クォータ超過、または反映中・削除中の場合
          $ref: '#/components/responses/ConflictError'

  /api/v1/projects/{projectId}/volumes/{volumeId}/apply:
    post:
      summary: ボリューム容量拡大の適用
      description: 下書き (pending) にあるボリューム容量拡大を Kubernetes PVC に反映させます。
      tags: [Volumes]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/VolumeIdPath'
      responses:
        '200':
          description: 適用開始
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: pending が無い、またはすでに反映中・削除中の場合
          $ref: '#/components/responses/ConflictError'

  /api/v1/projects/{projectId}/volumes/{volumeId}/discard:
    post:
      summary: ボリューム容量拡大の下書き破棄
      description: 下書き (pending) にあるボリューム容量拡大設定を破棄します。
      tags: [Volumes]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/VolumeIdPath'
      responses:
        '200':
          description: 破棄完了
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: 反映中または削除中の場合
          $ref: '#/components/responses/ConflictError'

  # ============================================================================
  # Quota
  # ============================================================================
  /api/v1/quota:
    get:
      summary: 自分のクォータとリソース使用量取得
      description: ログイン中ユーザーのリソース上限 (projects, deploys, volumes, spec制限等) と現在の使用量を取得します。
      tags: [Quota]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: クォータと使用量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/admin/users/{userId}/quota:
    get:
      summary: ユーザーのクォータ上限取得 (管理者)
      description: 指定したユーザーに割り当てられているリソース上限値を取得します。
      tags: [Quota]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: ユーザーのクォータ設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserQuotaResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: ユーザーのクォータ上限変更 (管理者)
      description: 指定したユーザーのリソース上限値を更新します。
      tags: [Quota]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserQuotaRequest'
      responses:
        '200':
          description: 更新完了
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

# ==============================================================================
# Components
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access Token (有効期限15分、ヘッダ Authorization: Bearer <accessToken>)"
    RefreshTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Refresh Token (`/auth/refresh` や `/auth/logout` に使用)

  parameters:
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        example: project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
    DeployIdPath:
      name: deployId
      in: path
      required: true
      schema:
        type: string
        example: deploy-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
    BuildIdPath:
      name: buildId
      in: path
      required: true
      schema:
        type: string
        example: build-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
    IngressIdPath:
      name: ingressId
      in: path
      required: true
      schema:
        type: string
        example: ingress-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
    VolumeIdPath:
      name: volumeId
      in: path
      required: true
      schema:
        type: string
        example: volume-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        example: userid-80b0b29c-7514-40dd-a0b4-8f22f09329d8
    LimitQuery:
      name: limit
      in: query
      required: false
      description: 取得件数 (1〜100、デフォルト 20)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: ページング用カーソル (前回の nextCursor)
      schema:
        type: string
        nullable: true

  responses:
    BadRequestError:
      description: リクエストの形式やパラメータが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    UnauthorizedError:
      description: 認証失敗またはトークン期限切れ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ForbiddenError:
      description: 操作権限がない (管理者でないなど)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFoundError:
      description: 対象リソースが存在しない、または他ユーザーのリソース
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ConflictError:
      description: 競合・状態不整合 (排他制御中、名前重複、上限超過など)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    PayloadTooLargeError:
      description: アップロードサイズが上限超過 (100MB超)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequestsError:
      description: レートリミット制限
      headers:
        Retry-After:
          description: 再試行可能になるまでの秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailableError:
      description: 外部サービス接続不可など一時的エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    # --------------------------------------------------------------------------
    # Common
    # --------------------------------------------------------------------------
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - payload_too_large
                - too_many_requests
                - internal_error
                - service_unavailable
              example: not_found
            message:
              type: string
              example: resource not found

    # --------------------------------------------------------------------------
    # Auth Schemas
    # --------------------------------------------------------------------------
    AuthConfigResponse:
      type: object
      required: [turnstile]
      properties:
        turnstile:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              example: true
            siteKey:
              type: string
              example: 0x4AAAAAAAx...

    SignupRequest:
      type: object
      required: [userName, password]
      properties:
        userName:
          type: string
          pattern: '^[a-zA-Z0-9-]{1,64}$'
          example: alice
        password:
          type: string
          minLength: 12
          example: CorrectHorseBatteryStaple123
        invitationCode:
          type: string
          description: 招待制モードのときに必須
          example: opIJOdrJssFhh9J1KslFxIttdk8qVSWx7tXcrkaQBu8
        turnstileToken:
          type: string
          description: Turnstile 有効時に必須
          example: 0.abcdef...

    LoginRequest:
      type: object
      required: [userName, password]
      properties:
        userName:
          type: string
          example: alice
        password:
          type: string
          example: CorrectHorseBatteryStaple123
        turnstileToken:
          type: string
          description: Turnstile 有効時に必須
          example: 0.abcdef...

    AuthTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT トークン (signup/login 時は refreshToken、refresh 時は accessToken)
          example: eyJhbGciOiJFZERTQ...

    User:
      type: object
      required: [userId, userName, status, role, createdAt]
      properties:
        userId:
          type: string
          example: userid-80b0b29c-7514-40dd-a0b4-8f22f09329d8
        userName:
          type: string
          example: alice
        status:
          type: string
          enum: [active, banned]
          example: active
        role:
          type: string
          enum: [user, admin]
          example: user
        createdAt:
          type: string
          format: date-time
          example: "2026-11-15T20:38:25+09:00"

    LoginHistoryItem:
      type: object
      required: [historyId, ip, userAgent, createdAt]
      properties:
        historyId:
          type: string
          example: loginhistory-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
        ip:
          type: string
          example: 192.0.2.1
        userAgent:
          type: string
          example: Mozilla/5.0...
        createdAt:
          type: string
          format: date-time
          example: "2026-11-15T20:38:25+09:00"

    LoginHistoryResponse:
      type: object
      required: [history, nextCursor]
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/LoginHistoryItem'
        nextCursor:
          type: string
          nullable: true
          example: null

    JWKSResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, kid, use, alg]
            properties:
              kty:
                type: string
                example: OKP
              crv:
                type: string
                example: Ed25519
              x:
                type: string
                example: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
              kid:
                type: string
                example: auth-key-2026-11
              use:
                type: string
                example: sig
              alg:
                type: string
                example: EdDSA

    # --------------------------------------------------------------------------
    # Auth Admin Schemas
    # --------------------------------------------------------------------------
    AdminUserListResponse:
      type: object
      required: [users, nextCursor]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
          nullable: true
          example: null

    CreateInvitationRequest:
      type: object
      properties:
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
          example: 24
        note:
          type: string
          maxLength: 200
          example: for carol

    CreateInvitationResponse:
      type: object
      required: [invitationId, code, expiresAt]
      properties:
        invitationId:
          type: string
          example: invitation-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        code:
          type: string
          example: opIJOdrJssFhh9J1KslFxIttdk8qVSWx7tXcrkaQBu8
        expiresAt:
          type: string
          format: date-time
          example: "2026-11-16T20:38:26+09:00"

    InvitationListItem:
      type: object
      required: [invitationId, note, status, createdBy, createdAt, expiresAt]
      properties:
        invitationId:
          type: string
          example: invitation-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        note:
          type: string
          example: for carol
        status:
          type: string
          enum: [active, used, expired, revoked]
          example: active
        createdBy:
          type: string
          example: userid-80b0b29c-7514-40dd-a0b4-8f22f09329d8
        createdAt:
          type: string
          format: date-time
          example: "2026-11-15T20:38:26+09:00"
        expiresAt:
          type: string
          format: date-time
          example: "2026-11-16T20:38:26+09:00"
        usedBy:
          type: string
          nullable: true
          example: null
        usedAt:
          type: string
          format: date-time
          nullable: true
          example: null

    InvitationListResponse:
      type: object
      required: [invitations, nextCursor]
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationListItem'
        nextCursor:
          type: string
          nullable: true
          example: null

    # --------------------------------------------------------------------------
    # Project Schemas
    # --------------------------------------------------------------------------
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9-]{1,64}$'
          example: my-app

    CreateProjectResponse:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
          example: project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b

    UpdateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9-]{1,64}$'
          example: my-app-renamed

    Project:
      type: object
      required: [projectId, name, status]
      properties:
        projectId:
          type: string
          example: project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        name:
          type: string
          example: my-app
        status:
          type: string
          enum: [active, deleting, delete_failed]
          example: active

    ProjectListResponse:
      type: object
      required: [projects, nextCursor]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type: string
          nullable: true
          example: null

    # --------------------------------------------------------------------------
    # Build Schemas
    # --------------------------------------------------------------------------
    UploadResponse:
      type: object
      required: [assetsToken]
      properties:
        assetsToken:
          type: string
          description: 30分間有効なアップロードアセットトークン
          example: eyJhbGciOiJIUzUxMiIsInR5c...

    CreateBuildRequest:
      type: object
      required: [projectId, sourceType, buildMethod]
      properties:
        projectId:
          type: string
          example: project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        sourceType:
          type: string
          enum: [asset, git]
          example: asset
        asset:
          type: object
          properties:
            assetsToken:
              type: string
              example: eyJhbGciOiJIUzUxMiIsInR5c...
        git:
          type: object
          properties:
            repoUrl:
              type: string
              example: https://github.com/user/repo.git
            ref:
              type: string
              example: main
        buildTargetDirectory:
          type: string
          description: リポジトリ内のビルド対象ディレクトリ (省略時はルート)
          example: packages/api
        buildMethod:
          type: string
          enum: [dockerfile, railpack]
          example: dockerfile

    CreateBuildResponse:
      type: object
      required: [buildId, imageRef]
      properties:
        buildId:
          type: string
          example: build-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        imageRef:
          type: string
          example: registry.launchs-org.internal/project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b:build-6f1c2a3e

    BuildListItem:
      type: object
      required: [buildId, status, imageRef, createdAt]
      properties:
        buildId:
          type: string
          example: build-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        status:
          type: string
          enum: [pending, running, canceling, success, failed, canceled]
          example: success
        imageRef:
          type: string
          example: registry.launchs-org.internal/project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b:build-6f1c2a3e
        createdAt:
          type: string
          format: date-time
          example: "2026-09-16T09:00:00+09:00"

    BuildListResponse:
      type: object
      required: [builds, nextCursor]
      properties:
        builds:
          type: array
          items:
            $ref: '#/components/schemas/BuildListItem'
        nextCursor:
          type: string
          nullable: true
          example: null

    BuildDetail:
      type: object
      required: [buildId, status, imageRef]
      properties:
        buildId:
          type: string
          example: build-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        status:
          type: string
          enum: [pending, running, canceling, success, failed, canceled]
          example: running
        imageRef:
          type: string
          example: registry.launchs-org.internal/project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b:build-6f1c2a3e

    BuildLogsResponse:
      type: object
      required: [logs, nextSince]
      properties:
        logs:
          type: string
          example: "Step 1/5 : FROM golang:1.27\n..."
        nextSince:
          type: integer
          example: 256

    # --------------------------------------------------------------------------
    # Deploy Schemas
    # --------------------------------------------------------------------------
    CreateDeployRequest:
      type: object
      required: [projectId, imageRef, spec]
      properties:
        projectId:
          type: string
          example: project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        imageRef:
          type: string
          example: registry.launchs-org.internal/project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b:build-6f1c2a3e
        spec:
          type: string
          enum: [small, medium, large]
          example: small

    CreateDeployResponse:
      type: object
      required: [deployId]
      properties:
        deployId:
          type: string
          example: deploy-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b

    ScaleDeployRequest:
      type: object
      required: [replicas]
      properties:
        replicas:
          type: integer
          minimum: 0
          maximum: 5
          example: 2

    PodInfo:
      type: object
      required: [podId, status]
      properties:
        podId:
          type: string
          example: pod-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        status:
          type: string
          example: running

    LogPodInfo:
      type: object
      required: [podId, running, startedAt]
      properties:
        podId:
          type: string
          example: pod-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        running:
          type: boolean
          example: true
        startedAt:
          type: string
          format: date-time
          example: "2026-09-16T09:00:00+09:00"
        endedAt:
          type: string
          format: date-time
          nullable: true
          example: null

    DeployListItem:
      type: object
      required: [deployId, status, spec, replicas, imageRef, createdAt]
      properties:
        deployId:
          type: string
          example: deploy-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        status:
          type: string
          enum: [pending, creating, active, applying, scaling, failed, deleting, delete_failed]
          example: active
        spec:
          type: string
          enum: [small, medium, large]
          example: small
        replicas:
          type: integer
          example: 1
        imageRef:
          type: string
          example: registry.launchs-org.internal/project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b:build-6f1c2a3e
        createdAt:
          type: string
          format: date-time
          example: "2026-09-16T09:00:00+09:00"

    ProjectEvent:
      type: object
      required: [eventId, type, reason, message, objectKind, objectName, deployId, count, firstSeenAt, lastSeenAt]
      properties:
        eventId:
          type: string
          example: event-1024
        type:
          type: string
          enum: [Normal, Warning]
        reason:
          type: string
          example: BackOff
        message:
          type: string
          example: Back-off pulling image "nginx:nothing"
        objectKind:
          type: string
          example: Pod
        objectName:
          type: string
        deployId:
          type: string
          nullable: true
          description: 対象が deploy に属するときの deploy の ID。属さなければ null
        count:
          type: integer
          description: 同じ Event が起きた回数
          example: 3
        firstSeenAt:
          type: string
          format: date-time
          example: '2026-11-17T12:00:00+09:00'
        lastSeenAt:
          type: string
          format: date-time
          example: '2026-11-17T12:05:00+09:00'

    ProjectEventListResponse:
      type: object
      required: [events, nextCursor]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ProjectEvent'
        nextCursor:
          type: string
          nullable: true
          example: null

    DeployListResponse:
      type: object
      required: [deploys, nextCursor]
      properties:
        deploys:
          type: array
          items:
            $ref: '#/components/schemas/DeployListItem'
        nextCursor:
          type: string
          nullable: true
          example: null

    DeployConfigData:
      type: object
      required: [env, pending_env, command, pending_command, args, pending_args]
      properties:
        env:
          type: object
          additionalProperties:
            type: string
          example:
            PORT: "8080"
            DATABASE_URL: "postgres://..."
        pending_env:
          type: object
          nullable: true
          additionalProperties:
            type: string
          example: null
        command:
          type: string
          nullable: true
          example: /app/server
        pending_command:
          type: string
          nullable: true
          example: null
        args:
          type: array
          nullable: true
          items:
            type: string
          example: ["--config", "/app/config.yaml"]
        pending_args:
          type: array
          nullable: true
          items:
            type: string
          example: null

    MountItem:
      type: object
      required: [volumeId, mountPath]
      properties:
        volumeId:
          type: string
          example: volume-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        mountPath:
          type: string
          example: /data

    DeployMountsData:
      type: object
      required: [mounts, pending_mounts]
      properties:
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/MountItem'
        pending_mounts:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MountItem'

    DeployDetail:
      type: object
      required:
        - deployId
        - projectId
        - status
        - spec
        - replicas
        - pods
        - logPods
        - imageRef
        - createdAt
        - config
        - volumes
      properties:
        deployId:
          type: string
          example: deploy-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        projectId:
          type: string
          example: project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        status:
          type: string
          enum: [pending, creating, active, applying, scaling, failed, deleting, delete_failed]
          example: active
        spec:
          type: string
          enum: [small, medium, large]
          example: small
        replicas:
          type: integer
          example: 1
        pods:
          type: array
          items:
            $ref: '#/components/schemas/PodInfo'
        logPods:
          type: array
          items:
            $ref: '#/components/schemas/LogPodInfo'
        imageRef:
          type: string
          example: registry.launchs-org.internal/project-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b:build-6f1c2a3e
        createdAt:
          type: string
          format: date-time
          example: "2026-09-16T09:00:00+09:00"
        config:
          $ref: '#/components/schemas/DeployConfigData'
        volumes:
          $ref: '#/components/schemas/DeployMountsData'
        service:
          nullable: true
          $ref: '#/components/schemas/ServiceInfo'

    DeployLogsResponse:
      type: object
      required: [logs, nextSince]
      properties:
        logs:
          type: string
          example: "2026-09-16T09:00:01+09:00 server started on :8080\n"
        nextSince:
          type: integer
          example: 128

    DeployConfigResponse:
      type: object
      required: [config]
      properties:
        config:
          $ref: '#/components/schemas/DeployConfigData'

    UpdateDeployConfigRequest:
      type: object
      required: [env]
      properties:
        env:
          type: object
          additionalProperties:
            type: string
          example:
            PORT: "8081"
        command:
          type: string
          nullable: true
          example: /app/start
        args:
          type: array
          nullable: true
          items:
            type: string
          example: ["--production"]

    DeployMountsResponse:
      type: object
      required: [mounts]
      properties:
        mounts:
          $ref: '#/components/schemas/DeployMountsData'

    UpdateDeployMountsRequest:
      type: object
      required: [mounts]
      properties:
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/MountItem'

    # --------------------------------------------------------------------------
    # Service Schemas
    # --------------------------------------------------------------------------
    ServicePort:
      type: object
      required: [name, port, protocol]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9-]{1,15}$'
          example: web
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 8080
        protocol:
          type: string
          enum: [tcp, udp]
          example: tcp

    CreateServiceRequest:
      type: object
      required: [ports]
      properties:
        ports:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServicePort'

    UpdateServicePortsRequest:
      type: object
      required: [ports]
      properties:
        ports:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServicePort'

    ServiceInfo:
      type: object
      required: [serviceId, ports, pending_ports, status, dnsName, clusterIP]
      properties:
        serviceId:
          type: string
          example: service-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        ports:
          type: array
          items:
            $ref: '#/components/schemas/ServicePort'
        pending_ports:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ServicePort'
        status:
          type: string
          description: service 自体の払い出し状態(deploy の status とは別)。deploy の削除中は、deleting として返る。
          enum: [pending, active, failed, deleting]
          example: active
        dnsName:
          type: string
          nullable: true
          description: "`<serviceId>.<projectId>.svc.<クラスターのドメイン>`。active になるまで null。"
          example: service-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b.project-0a1b2c3d-4e5f-6789-abcd-ef0123456789.svc.test-cluster.local
        clusterIP:
          type: string
          nullable: true
          description: active になるまで null(ClusterIP が払い出されない種類のときも null)。
          example: 10.43.12.7

    # --------------------------------------------------------------------------
    # Ingress Schemas
    # --------------------------------------------------------------------------
    CreateIngressResponse:
      type: object
      required: [ingressId, host]
      properties:
        ingressId:
          type: string
          example: ingress-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        host:
          type: string
          example: giant-orange-eagle.shconn.org

    IngressRule:
      type: object
      required: [path, serviceId, port]
      properties:
        path:
          type: string
          pattern: '^/.*'
          example: /api
        serviceId:
          type: string
          example: service-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        port:
          type: integer
          example: 8080

    UpdateIngressRulesRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/IngressRule'

    IngressListItem:
      type: object
      required: [ingressId, host]
      properties:
        ingressId:
          type: string
          example: ingress-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        host:
          type: string
          example: giant-orange-eagle.shconn.org

    IngressListResponse:
      type: object
      required: [ingresses, nextCursor]
      properties:
        ingresses:
          type: array
          items:
            $ref: '#/components/schemas/IngressListItem'
        nextCursor:
          type: string
          nullable: true
          example: null

    IngressDetail:
      type: object
      required: [ingressId, host, rules, pending_rules, status]
      properties:
        ingressId:
          type: string
          example: ingress-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        host:
          type: string
          example: giant-orange-eagle.shconn.org
        rules:
          type: array
          items:
            $ref: '#/components/schemas/IngressRule'
        pending_rules:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/IngressRule'
        status:
          type: string
          enum: [active, applying, deleting]
          example: active

    # --------------------------------------------------------------------------
    # Volume Schemas
    # --------------------------------------------------------------------------
    CreateVolumeRequest:
      type: object
      required: [name, sizeMB]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9-]{1,64}$'
          example: db-data
        sizeMB:
          type: integer
          minimum: 1024
          example: 1024

    CreateVolumeResponse:
      type: object
      required: [volumeId]
      properties:
        volumeId:
          type: string
          example: volume-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b

    RenameVolumeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9-]{1,64}$'
          example: db-data-renamed

    ResizeVolumeRequest:
      type: object
      required: [sizeMB]
      properties:
        sizeMB:
          type: integer
          description: 現在の容量より大きい値を指定 (縮小不可、pending 保存)
          minimum: 1024
          example: 2048

    VolumeListItem:
      type: object
      required: [volumeId, name, status, sizeMB, pending_sizeMB]
      properties:
        volumeId:
          type: string
          example: volume-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        name:
          type: string
          example: db-data
        status:
          type: string
          enum: [active, creating, applying, deleting]
          example: active
        sizeMB:
          type: integer
          example: 1024
        pending_sizeMB:
          type: integer
          nullable: true
          example: null

    VolumeListResponse:
      type: object
      required: [volumes, nextCursor]
      properties:
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/VolumeListItem'
        nextCursor:
          type: string
          nullable: true
          example: null

    VolumeDetail:
      type: object
      required: [volumeId, name, status, sizeMB, pending_sizeMB]
      properties:
        volumeId:
          type: string
          example: volume-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        name:
          type: string
          example: db-data
        status:
          type: string
          enum: [active, creating, applying, deleting]
          example: active
        sizeMB:
          type: integer
          example: 1024
        pending_sizeMB:
          type: integer
          nullable: true
          example: null

    # --------------------------------------------------------------------------
    # Quota Schemas
    # --------------------------------------------------------------------------
    QuotaUsageItem:
      type: object
      required: [used, limit]
      properties:
        used:
          type: integer
          example: 3
        limit:
          type: integer
          example: 10

    QuotaResponse:
      type: object
      required:
        - maxReplicasPerDeploy
        - maxVolumeSizeMB
        - projects
        - deploys
        - volumes
        - volumeTotalMB
        - specs
      properties:
        maxReplicasPerDeploy:
          type: integer
          example: 5
        maxVolumeSizeMB:
          type: integer
          example: 10240
        projects:
          $ref: '#/components/schemas/QuotaUsageItem'
        deploys:
          $ref: '#/components/schemas/QuotaUsageItem'
        volumes:
          $ref: '#/components/schemas/QuotaUsageItem'
        volumeTotalMB:
          $ref: '#/components/schemas/QuotaUsageItem'
        specs:
          type: object
          properties:
            small:
              $ref: '#/components/schemas/QuotaUsageItem'
            medium:
              $ref: '#/components/schemas/QuotaUsageItem'
            large:
              $ref: '#/components/schemas/QuotaUsageItem'

    AdminUserQuotaResponse:
      type: object
      required:
        - maxProjects
        - maxDeploys
        - maxVolumes
        - maxVolumeTotalMB
        - maxReplicasPerDeploy
        - maxVolumeSizeMB
        - specs
      properties:
