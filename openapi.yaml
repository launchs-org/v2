          type: integer
          example: 10
        maxDeploys:
          type: integer
          example: 20
        maxVolumes:
          type: integer
          example: 10
        maxVolumeTotalMB:
          type: integer
          example: 51200
        maxReplicasPerDeploy:
          type: integer
          example: 5
        maxVolumeSizeMB:
          type: integer
          example: 10240
        specs:
          type: object
          properties:
            small:
              type: integer
              example: 10
            medium:
              type: integer
              example: 5
            large:
              type: integer
              example: 2

    AdminUpdateUserQuotaRequest:
      type: object
      properties:
        maxProjects:
          type: integer
          example: 10
        maxDeploys:
          type: integer
          example: 20
        maxVolumes:
          type: integer
          example: 10
        maxVolumeTotalMB:
          type: integer
          example: 51200
        specs:
          type: object
          properties:
            small:
              type: integer
              example: 10
            medium:
              type: integer
              example: 5
            large:
              type: integer
              example: 2
