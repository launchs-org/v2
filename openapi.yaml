    get:
      summary: デプロイログ取得
      description: 指定した Pod の標準出力・標準エラーログをポーリング取得します。
      tags: [Deploys]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeployIdPath'
        - name: podId
          in: query
          required: true
          description: ログ対象の Pod ID
          schema:
            type: string
            example: pod-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
        - name: since
          in: query
          required: false
          description: 前回取得した nextSince の値。省略時は最新ログ
          schema:
            type: integer
            example: 0
      responses:
        '200':
          description: ログデータ
