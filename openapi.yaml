openapi: 3.1.0
info:
  title: Launchs API
  version: 1.0.0
  description: |
    Launchs の全 API 仕様書。
    認証サービス (`/auth/...`)、バックエンド API (`/api/v1/...`)、および運用のヘルスチェックエンドポイントを含みます。
    同一オリジンでリバースプロキシ (Traefik / Nginx) 経由でルーティングされます。

servers:
  - url: /
    description: Current host (Reverse proxy root)

tags:
  - name: Health
    description: 運用のための死活監視・ヘルスチェック
  - name: Auth
    description: 認証・アカウント登録・セッション管理
  - name: Auth Admin
    description: アカウント管理 (管理者専用)
  - name: Projects
    description: プロジェクト管理
  - name: Builds
    description: ソースコードのアップロードとコンテナイメージのビルド
  - name: Deploys
    description: デプロイ・スケール・ログ・起動設定
  - name: Services
    description: デプロイのポート公開 (Kubernetes Service)
  - name: Ingresses
    description: 外部公開ルーティング (Kubernetes Ingress)
  - name: Volumes
    description: 永続ストレージ (PersistentVolumeClaim)
  - name: Quota
    description: リソースクォータ・利用状況の確認と管理

paths:
  # ============================================================================
  # Health
  # ============================================================================
  /healthz:
    get:
      summary: バックエンドヘルスチェック
      description: バックエンドプロセスが稼働しているかを返します。認証は不要です。
      tags: [Health]
      responses:
        '200':
          description: 正常稼働中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/healthz:
    get:
      summary: 認証サービスヘルスチェック
      description: 認証サービスプロセスが稼働しているかを返します。認証は不要です。
      tags: [Health]
      responses:
        '200':
          description: 正常稼働中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ============================================================================
  # Auth
  # ============================================================================
  /auth/config:
    get:
      summary: 認証公開設定取得
      description: Cloudflare Turnstile などの公開設定を取得します。認証は不要です。
      tags: [Auth]
      responses:
        '200':
          description: 認証公開設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigResponse'

  /auth/signup:
    post:
      summary: サインアップ (ユーザー登録)
      description: 新規アカウントを作成し、初期ログイン用の refresh token を返します。
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: サインアップ成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: ユーザー名の重複
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /auth/login:
    post:
      summary: ログイン
      description: ユーザー名とパスワードを検証し、refresh token を返します。
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: 認証失敗 (ユーザー不在、パスワード不一致、ロック中、BAN中など)
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /auth/refresh:
    post:
      summary: アクセストークン取得 (リフレッシュ)
      description: 有効な refresh token を用いて新しい access token を取得します。
      tags: [Auth]
      security:
        - RefreshTokenAuth: []
      responses:
        '200':
          description: アクセストークン発行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      summary: 自分のアカウント情報取得
      description: ログイン中のユーザー自身の情報を取得します。
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      summary: ログアウト
      description: 現在のセッションの refresh token を無効化します。
      tags: [Auth]
      security:
        - RefreshTokenAuth: []
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/login-history:
    get:
      summary: ログイン履歴取得
      description: ログイン中のユーザーの直近のログイン履歴を取得します。
      tags: [Auth]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: ログイン履歴一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginHistoryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/.well-known/jwks.json:
    get:
      summary: JWKS (公開鍵) 取得
      description: Access Token の署名検証用公開鍵セット (JWKS) を返します。
      tags: [Auth]
      responses:
        '200':
          description: JWKS データ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSResponse'

  # ============================================================================
  # Auth Admin
  # ============================================================================
  /auth/admin/users:
    get:
      summary: ユーザー一覧 (管理者)
      description: 登録ユーザーの一覧を新しい順に取得します。
      tags: [Auth Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: ユーザー一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /auth/admin/users/{userId}:
    get:
      summary: ユーザー詳細 (管理者)
      description: 指定したユーザーの詳細を取得します。
      tags: [Auth Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /auth/admin/users/{userId}/ban:
    post:
      summary: ユーザー停止 (管理者)
      description: ユーザーを停止 (banned) にし、発行済み refresh token をすべて無効化します。
      tags: [Auth Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: 停止完了
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 自分自身の停止など
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: すでに停止中の場合
          $ref: '#/components/responses/ConflictError'

  /auth/admin/users/{userId}/unban:
    post:
      summary: ユーザー停止解除 (管理者)
      description: ユーザーの停止状態を解除 (active) に戻します。
      tags: [Auth Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: 停止解除完了
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: 停止中でない場合
          $ref: '#/components/responses/ConflictError'

  /auth/admin/users/{userId}/unlock:
    post:
      summary: ログインロック解除 (管理者)
      description: ログイン試行失敗によるアカウントロックを解除します。
      tags: [Auth Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: ロック解除完了
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /auth/admin/invitations:
    post:
      summary: 招待コード発行 (管理者)
      description: 招待制サインアップ用の招待コードを発行します。コードは発行レスポンスでのみ返されます。
      tags: [Auth Admin]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '200':
          description: 招待コード発行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    get:
      summary: 招待コード一覧 (管理者)
      description: 発行済みの招待コード一覧を取得します (コード文字列自体は含まれません)。
      tags: [Auth Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: 招待コード一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /auth/admin/invitations/{invitationId}:
    delete:
      summary: 招待コード取り消し (管理者)
      description: 有効な招待コードを取り消し (revoked) にします。
      tags: [Auth Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            example: invitation-6f1c2a3e-8b4d-4e5f-9a1b-2c3d4e5f6a7b
      responses:
        '200':
          description: 取り消し完了
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: すでに無効 (使用済み、期限切れ、取り消し済み) の場合
          $ref: '#/components/responses/ConflictError'

  # ============================================================================
  # Projects
  # ============================================================================
  /api/v1/projects:
    post:
      summary: プロジェクト作成
      description: 新しいプロジェクトを作成します。
      tags: [Projects]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: プロジェクト作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: プロジェクト名の重複
          $ref: '#/components/responses/ConflictError'
    get:
      summary: プロジェクト一覧取得
      description: 自分が所有するプロジェクト一覧を作成日時の降順で取得します。
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: プロジェクト一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/projects/{projectId}:
    get:
      summary: プロジェクト詳細取得
      description: プロジェクトの詳細情報を取得します。
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: プロジェクト情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: プロジェクト名変更
      description: プロジェクトの名前を変更します。
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 変更完了
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: プロジェクト名の重複、またはプロジェクトが deleting / delete_failed
          $ref: '#/components/responses/ConflictError'
    delete:
      summary: プロジェクト削除
      description: |
        プロジェクトを削除します。配下のビルド、デプロイ、ボリューム、Ingress、および Kubernetes namespace も非同期で削除されます。
        即座に応答し、status は "deleting" となります。
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: 削除受付完了
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: すでに deleting 中の場合
          $ref: '#/components/responses/ConflictError'

  /api/v1/projects/{projectId}/builds:
    get:
      summary: プロジェクトのビルド履歴一覧
      description: プロジェクトに属するビルド履歴を作成日時の降順で取得します。
      tags: [Builds]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: ビルド履歴一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/projects/{projectId}/deploys:
    get:
      summary: プロジェクトのデプロイ履歴一覧
      description: プロジェクトに属するデプロイ履歴を作成日時の降順で取得します。
      tags: [Deploys]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: デプロイ履歴一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/projects/{projectId}/events:
    get:
      summary: プロジェクトのイベント一覧
      description: |
        プロジェクトの namespace で起きた k8s の Event (Pulling / Failed / BackOff / FailedScheduling など) を、最後に起きた時刻の新しい順に取得します。
        watcher が k8s から集めて DB に保存したものを読みます (保持は 7 日、1 プロジェクト最大 5,000 件)。
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: limit
          in: query
          required: false
          description: 取得件数 (1〜100、デフォルト 50)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: '#/components/parameters/CursorQuery'
        - name: type
          in: query
          required: false
          description: 種類で絞り込む
          schema:
            type: string
            enum: [Normal, Warning]
        - name: deployId
          in: query
          required: false
          description: この deploy の Event だけにする
          schema:
            type: string
        - name: reason
          in: query
          required: false
          description: 理由 (完全一致)
          schema:
            type: string
            example: BackOff
      responses:
        '200':
          description: イベント一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEventListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ============================================================================
  # Builds & Upload
  # ============================================================================
  /api/v1/upload:
    post:
      summary: ソースコード zip アップロード
      description: ソースコードの zip アーカイブをアップロードし、一時的な asset トークンを取得します (最大 100MB)。
      tags: [Builds]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: アップロード成功 (assetToken 発行)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: zip 形式として不正な場合
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '413':
          description: 100MB を超過した場合
          $ref: '#/components/responses/PayloadTooLargeError'

  /api/v1/build:
    post:
      summary: ビルド開始
      description: ソース (asset または git) からコンテナイメージのビルドを非同期で開始します。
      tags: [Builds]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildRequest'
      responses:
        '200':
          description: ビルド受付完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuildResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: プロジェクトが deleting 中
          $ref: '#/components/responses/ConflictError'

  /api/v1/build/{buildId}:
    get:
      summary: ビルド状態取得
      description: ビルドの進捗ステータスとイメージ参照を取得します。
      tags: [Builds]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildIdPath'
      responses:
        '200':
          description: ビルド詳細情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/build/{buildId}/logs:
    get:
      summary: ビルドログ取得
      description: ビルドの標準出力ログをポーリング取得します。since パラメータで差分のみ取得可能です。
      tags: [Builds]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildIdPath'
        - name: since
          in: query
          required: false
          description: 前回取得した nextSince の値。省略時は先頭から
          schema:
            type: integer
            example: 0
      responses:
        '200':
          description: ログデータ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildLogsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/build/{buildId}/cancel:
    post:
      summary: ビルドキャンセル
      description: 実行中のビルドを中断・キャンセルします。
      tags: [Builds]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildIdPath'
