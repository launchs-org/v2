# フロントエンド(Next.js の standalone)。/api と /auth は、Traefik が、backend と auth へ振り分けるので、ここには来ない。
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: launchs
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: launchs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
        - name: frontend
          image: ghcr.io/launchs-org/v2/frontend:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 3000}
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 512Mi}
