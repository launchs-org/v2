# launchs の本番向けのマニフェスト。この場所で、`kubectl apply -k .` する(手順は README.md)。
# namespace は、各ファイルに明記している(accessstats の Role は、Traefik の namespace に置くため、namespace の一括指定は使わない)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - config.yaml
  # 秘密(gitignore。secret.example.yaml をコピーして作る)。
  - secret.yaml
  - rbac.yaml
  - postgres.yaml
  - temporal.yaml
  - auth.yaml
  - backend.yaml
  - worker.yaml
  - watcher.yaml
  - logcollector.yaml
  - accessstats.yaml
  - frontend.yaml
  - ingressroute.yaml
  - pdb.yaml

# 3 つのノードで動かす(auth、backend、worker、frontend、Temporal は、3 つ。watcher、logcollector、accessstats も 3 つ立てるが、リーダーの 1 つだけが動き、残りは、待機)。
# 数を変えるのは、ここだけ(各ファイルの replicas は、この値で上書きされる)。PostgreSQL は、1 つのまま(README の「高可用性」)。
replicas:
  - {name: auth, count: 3}
  - {name: backend, count: 3}
  - {name: worker, count: 3}
  - {name: watcher, count: 3}
  - {name: logcollector, count: 3}
  - {name: accessstats, count: 3}
  - {name: frontend, count: 3}
  - {name: temporal, count: 3}

# イメージのタグ。main に push されるたび、sha-<コミットの短い SHA> と latest が、GHCR に push される(.github/workflows/release.yml)。
# 本番では、latest ではなく、sha-… を指定して、固定する(どのコミットが動いているかが、分かるように)。
images:
  - {name: ghcr.io/launchs-org/v2/backend, newTag: sha-89e8bc5}
  - {name: ghcr.io/launchs-org/v2/worker, newTag: sha-89e8bc5}
  - {name: ghcr.io/launchs-org/v2/watcher, newTag: sha-89e8bc5}
  - {name: ghcr.io/launchs-org/v2/logcollector, newTag: sha-89e8bc5}
  - {name: ghcr.io/launchs-org/v2/accessstats, newTag: sha-89e8bc5}
  - {name: ghcr.io/launchs-org/v2/auth, newTag: sha-89e8bc5}
  - {name: ghcr.io/launchs-org/v2/frontend, newTag: sha-89e8bc5}
  - {name: ghcr.io/launchs-org/v2/migrate, newTag: sha-89e8bc5}
