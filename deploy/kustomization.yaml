# launchs の本番向けのマニフェスト(本体)。この場所で、`kubectl apply -k .` する(手順は README.md)。
# 環境ごとの設定(ConfigMap `launchs-config` と、Secret)は、ここには含めない。`settings/` に置いて、別に、先に適用する(`kubectl apply -k settings/`)。
# namespace は、各ファイルに明記している(accessstats の Role は、Traefik の namespace に置くため、namespace の一括指定は使わない)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - postgres.yaml
  - temporal.yaml
  - auth.yaml
  - backend.yaml
  - worker.yaml
  - watcher.yaml
  - logcollector.yaml
  - accessstats.yaml
  - exporter.yaml
  - admin.yaml
  - frontend.yaml
  # 環境ごとの設定(ConfigMap launchs-config)。Argo CD の kustomize.patches で、上書きできる(argocd.md)。秘密(settings/secret.yaml)は、含めない。
  - settings/config.yaml
  - ingressroute.yaml
  - pdb.yaml

# IngressRoute の Host は、ConfigMap launchs-config の LAUNCHS_HOST から取る(ホスト名を、1 か所で決めるため。上書きも、ConfigMap だけでよい)。
# match の式の、最初のバッククォートで囲まれた部分(Host(`…`))を、置き換える。
replacements:
  - source: {kind: ConfigMap, name: launchs-config, fieldPath: data.LAUNCHS_HOST}
    targets:
      - select: {kind: IngressRoute, name: launchs}
        fieldPaths:
          - spec.routes.0.match
          - spec.routes.1.match
          - spec.routes.2.match
          - spec.routes.3.match
        options: {delimiter: "`", index: 1}

# 3 つのノードで動かす(auth、backend、worker、frontend、Temporal は、3 つ。watcher、logcollector、accessstats、exporter も 3 つ立てるが、リーダーの 1 つだけが動き、残りは、待機)。
# 数を変えるのは、ここだけ(各ファイルの replicas は、この値で上書きされる)。PostgreSQL は、1 つのまま(README の「高可用性」)。
replicas:
  - {name: auth, count: 3}
  - {name: backend, count: 3}
  - {name: worker, count: 3}
  - {name: watcher, count: 3}
  - {name: logcollector, count: 3}
  - {name: accessstats, count: 3}
  - {name: exporter, count: 3}
  - {name: admin, count: 2}
  - {name: frontend, count: 3}
  - {name: temporal, count: 3}

# イメージのタグ。main に push されるたび、sha-<コミットの短い SHA> と latest が、GHCR に push される(.github/workflows/release.yml)。
# 本番では、latest ではなく、sha-… を指定して、固定する(どのコミットが動いているかが、分かるように)。
images:
  - {name: ghcr.io/launchs-org/v2/backend, newTag: sha-d5fa8ea}
  - {name: ghcr.io/launchs-org/v2/worker, newTag: sha-d5fa8ea}
  - {name: ghcr.io/launchs-org/v2/watcher, newTag: sha-d5fa8ea}
  - {name: ghcr.io/launchs-org/v2/logcollector, newTag: sha-d5fa8ea}
  - {name: ghcr.io/launchs-org/v2/accessstats, newTag: sha-d5fa8ea}
  - {name: ghcr.io/launchs-org/v2/exporter, newTag: sha-d5fa8ea}
  - {name: ghcr.io/launchs-org/v2/admin, newTag: sha-d5fa8ea}
  - {name: ghcr.io/launchs-org/v2/auth, newTag: sha-d5fa8ea}
  - {name: ghcr.io/launchs-org/v2/frontend, newTag: sha-d5fa8ea}
  - {name: ghcr.io/launchs-org/v2/migrate, newTag: sha-d5fa8ea}
