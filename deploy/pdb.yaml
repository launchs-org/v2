# ノードの入れ替え(drain)や、更新のとき、同時に止まる Pod の数を、制限する(各サービスは、最低 2 つを、動かし続ける)。
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth
  namespace: launchs
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: launchs
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
---
