   "launchs-edge": {
    "type": "inlinePlugin",
    "moduleName": "github.com/launchs-org/launchs-edge",
    "mountPath": "/plugins-local/src/github.com/launchs-org/launchs-edge",
    "source": {
     ".traefik.yml": "# Traefik のプラグインの、目録(ローカルプラグインでも、この形が要る)。\ndisplayName: launchs-edge\ntype: middleware\nimport: github.com/launchs-org/launchs-edge\nsummary: 信頼する接続元(cloudflared など)から来たとき、本当のクライアント IP と、正しい X-Forwarded-Proto/Port を、アプリに届ける。信頼しない接続元の Cf-* は、捨てる。\ntestData:\n  trustedCIDRs:\n    - 10.240.0.0/16\n",
     "edge.go": "// Package launchs_edge は、Traefik のミドルウェア(Yaegi のプラグイン)。entryPoint 全体に 1 つ入れて、アプリに、\n// 本当のクライアント IP と、正しい X-Forwarded-Proto / X-Forwarded-Port を届ける(dev-docs/ingress-plugins.md §3)。\n//\n// 標準ライブラリだけを使う(Yaegi は、外部パッケージを読み込めない)。全リクエストが通るので、小さく、安全に保つ:\n// パニックしても、リクエストを止めず、そのまま通す。\npackage launchs_edge\n\nimport (\n\t\"context\"\n\t\"encoding/json\"\n\t\"net\"\n\t\"net/http\"\n\t\"strings\"\n)\n\n// Config は、プラグインの設定(Middleware の spec.plugin.launchs-edge)。\ntype Config struct {\n\t// TrustedCIDRs は、信頼する接続元の範囲(例: cloudflared の Pod の範囲)。この範囲から来たときだけ、Cf-* などの値を使う。\n\t// 空、または、全てが不正なら、どの接続元も信頼しない(ヘッダーを、整理するだけ)。\n\tTrustedCIDRs []string `json:\"trustedCIDRs,omitempty\"`\n}\n\n// CreateConfig は、既定の設定を作る(Traefik が呼ぶ)。\n//\n// 戻り値:\n//   - 空の設定。\nfunc CreateConfig() *Config {\n\t// 信頼する範囲は、利用者が指定する。既定は、空。\n\treturn &Config{}\n}\n\n// Edge は、ミドルウェア本体。\ntype Edge struct {\n\tnext    http.Handler\n\tname    string\n\ttrusted []*net.IPNet\n}\n\n// New は、ミドルウェアを作る(Traefik が呼ぶ)。\n//\n// 不正な範囲は、読み飛ばす(設定の誤りで、全てのルートを、壊さないため)。エラーは返さない。\n//\n// 引数:\n//   - ctx: Traefik の context(使わない)。\n//   - next: 次のハンドラー。\n//   - config: 設定。\n//   - name: ミドルウェアの名前。\n//\n// 戻り値:\n//   - ミドルウェア。エラーは、常に nil。\nfunc New(ctx context.Context, next http.Handler, config *Config, name string) (http.Handler, error) {\n\t// 範囲を読み込む。読めないものは、飛ばす。\n\ttrusted := []*net.IPNet{}\n\tif config != nil {\n\t\tfor _, text := range config.TrustedCIDRs {\n\t\t\t_, network, parseError := net.ParseCIDR(strings.TrimSpace(text))\n\t\t\tif parseError == nil {\n\t\t\t\ttrusted = append(trusted, network)\n\t\t\t}\n\t\t}\n\t}\n\treturn &Edge{next: next, name: name, trusted: trusted}, nil\n}\n\n// ServeHTTP は、ヘッダーを整えて、次のハンドラーに渡す。\n//\n// 引数:\n//   - responseWriter: 応答の書き込み先。\n//   - request: リクエスト(ヘッダーを書き換える)。\nfunc (edge *Edge) ServeHTTP(responseWriter http.ResponseWriter, request *http.Request) {\n\t// ヘッダーの整理は、パニックしても、リクエストを止めない(整理に失敗したら、そのまま通す)。\n\tedge.rewrite(request)\n\tedge.next.ServeHTTP(responseWriter, request)\n}\n\n// rewrite は、リクエストのヘッダーを整える。パニックは、ここで止める。\n//\n// 引数:\n//   - request: リクエスト。\nfunc (edge *Edge) rewrite(request *http.Request) {\n\t// パニックしても、呼び出し元に伝えない。\n\tdefer func() { _ = recover() }()\n\tpeer := peerIP(request.RemoteAddr)\n\t// 接続元が、信頼する範囲の外なら、なりすましの元になる値を捨てて、接続元の IP を、クライアント IP にする。\n\tif peer == nil || !edge.isTrusted(peer) {\n\t\tfor _, name := range spoofableHeaders {\n\t\t\trequest.Header.Del(name)\n\t\t}\n\t\tif peer != nil {\n\t\t\trequest.Header.Set(\"X-Real-Ip\", peer.String())\n\t\t}\n\t\treturn\n\t}\n\t// 信頼する範囲のとき: Cf-Connecting-Ip、無ければ X-Forwarded-For の先頭を、クライアント IP にする。\n\tclient := net.ParseIP(strings.TrimSpace(request.Header.Get(\"Cf-Connecting-Ip\")))\n\tif client == nil {\n\t\tclient = net.ParseIP(firstForwardedFor(request.Header.Get(\"X-Forwarded-For\")))\n\t}\n\tif client == nil {\n\t\tclient = peer\n\t}\n\trequest.Header.Set(\"X-Real-Ip\", client.String())\n\t// X-Forwarded-For は、「クライアント, (元の続き)」の形にする(元の続きが、クライアント自身なら、足さない)。\n\texisting := strings.TrimSpace(request.Header.Get(\"X-Forwarded-For\"))\n\tchain := client.String()\n\tif existing != \"\" && firstForwardedFor(existing) != client.String() {\n\t\tchain = chain + \", \" + existing\n\t} else if existing != \"\" {\n\t\tchain = existing\n\t}\n\trequest.Header.Set(\"X-Forwarded-For\", chain)\n\t// 手前で、HTTPS を終端しているとき(Cf-Visitor のスキーム)は、正しい Proto と Port にする。\n\tswitch visitorScheme(request.Header.Get(\"Cf-Visitor\")) {\n\tcase \"https\":\n\t\trequest.Header.Set(\"X-Forwarded-Proto\", \"https\")\n\t\trequest.Header.Set(\"X-Forwarded-Port\", \"443\")\n\tcase \"http\":\n\t\trequest.Header.Set(\"X-Forwarded-Proto\", \"http\")\n\t\trequest.Header.Set(\"X-Forwarded-Port\", \"80\")\n\t}\n}\n\n// spoofableHeaders は、信頼する範囲の外から来たら捨てる、Cloudflare が付けるヘッダー(なりすませるため)。\nvar spoofableHeaders = []string{\"Cf-Connecting-Ip\", \"Cf-Visitor\", \"True-Client-Ip\", \"Cf-Ipcountry\", \"Cf-Ray\"}\n\n// isTrusted は、IP が、信頼する範囲に入っているかを返す。\n//\n// 引数:\n//   - ip: 接続元の IP。\n//\n// 戻り値:\n//   - 入っていれば true。\nfunc (edge *Edge) isTrusted(ip net.IP) bool {\n\t// 範囲を、順に確かめる。\n\tfor _, network := range edge.trusted {\n\t\tif network.Contains(ip) {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}\n\n// peerIP は、RemoteAddr(「IP:ポート」)から、IP を取り出す。\n//\n// 引数:\n//   - remoteAddr: 接続元のアドレス。\n//\n// 戻り値:\n//   - IP。読めなければ nil。\nfunc peerIP(remoteAddr string) net.IP {\n\t// ポートを除く。ポートが無い形にも、対応する。\n\thost, _, splitError := net.SplitHostPort(remoteAddr)\n\tif splitError != nil {\n\t\thost = remoteAddr\n\t}\n\treturn net.ParseIP(strings.Trim(host, \"[]\"))\n}\n\n// firstForwardedFor は、X-Forwarded-For の、先頭の要素を返す。\n//\n// 引数:\n//   - value: X-Forwarded-For の値。\n//\n// 戻り値:\n//   - 先頭の要素(前後の空白は除く)。空なら空文字。\nfunc firstForwardedFor(value string) string {\n\t// カンマで区切った、先頭。\n\tfirst, _, _ := strings.Cut(value, \",\")\n\treturn strings.TrimSpace(first)\n}\n\n// visitorScheme は、Cf-Visitor({\"scheme\":\"https\"})から、スキームを取り出す。\n//\n// 引数:\n//   - value: Cf-Visitor の値。\n//\n// 戻り値:\n//   - \"https\" か \"http\"。読めない、または、他の値なら空文字。\nfunc visitorScheme(value string) string {\n\t// JSON として読む(読めなければ、空)。\n\tvar visitor struct {\n\t\tScheme string `json:\"scheme\"`\n\t}\n\tif json.Unmarshal([]byte(value), &visitor) != nil {\n\t\treturn \"\"\n\t}\n\tscheme := strings.ToLower(visitor.Scheme)\n\tif scheme == \"https\" || scheme == \"http\" {\n\t\treturn scheme\n\t}\n\treturn \"\"\n}\n",
     "go.mod": "module github.com/launchs-org/launchs-edge\n\ngo 1.22\n"
    }
   },
   "launchs-stats": {
    "type": "inlinePlugin",
    "moduleName": "github.com/launchs-org/launchs-stats",
    "mountPath": "/plugins-local/src/github.com/launchs-org/launchs-stats",
    "source": {
     ".traefik.yml": "displayName: launchs-stats\ntype: middleware\nimport: github.com/launchs-org/launchs-stats\nsummary: ingress ごとのアクセスを集計し、一定の間隔で、標準出力に 1 行の JSON(LAUNCHS_STATS)として出す。\ntestData:\n  ingressId: ingress-test\n  intervalSeconds: 10\n  clientIPHeader: X-Real-Ip\n",
     "go.mod": "module github.com/launchs-org/launchs-stats\n\ngo 1.22\n",
     "path.go": "package launchs_stats\n\nimport \"strings\"\n\n// maxPathLength は、集計するパスの長さの上限。\nconst maxPathLength = 200\n\n// normalizePath は、集計用にパスをそろえる。クエリは落とし、数字・UUID・長い 16 進の区間は「:id」にする。\n// 長すぎるパスは「(other)」にする(キーの種類が増え続けないようにするため)。\nfunc normalizePath(rawPath string) string {\n\t// 空なら「/」。\n\tif rawPath == \"\" {\n\t\treturn \"/\"\n\t}\n\t// クエリを落とす。\n\tif index := strings.IndexByte(rawPath, '?'); index >= 0 {\n\t\trawPath = rawPath[:index]\n\t}\n\t// 長すぎれば、まとめる。\n\tif len(rawPath) > maxPathLength {\n\t\treturn \"(other)\"\n\t}\n\t// 区間ごとに見て、ID らしいものを置き換える。\n\tsegments := strings.Split(rawPath, \"/\")\n\tfor index, segment := range segments {\n\t\tif looksLikeID(segment) {\n\t\t\tsegments[index] = \":id\"\n\t\t}\n\t}\n\treturn strings.Join(segments, \"/\")\n}\n\n// looksLikeID は、区間が、ID のように見えるか(数字だけ、UUID、16 文字以上の 16 進)を返す。\nfunc looksLikeID(segment string) bool {\n\t// 空は違う。\n\tif segment == \"\" {\n\t\treturn false\n\t}\n\t// 数字だけ。\n\tallDigits := true\n\tfor _, character := range segment {\n\t\tif character < '0' || character > '9' {\n\t\t\tallDigits = false\n\t\t\tbreak\n\t\t}\n\t}\n\tif allDigits {\n\t\treturn true\n\t}\n\t// UUID(8-4-4-4-12 の 16 進)。\n\tif len(segment) == 36 && segment[8] == '-' && segment[13] == '-' && segment[18] == '-' && segment[23] == '-' {\n\t\treturn isHex(strings.ReplaceAll(segment, \"-\", \"\"))\n\t}\n\t// 16 文字以上の 16 進。\n\treturn len(segment) >= 16 && isHex(segment)\n}\n\n// isHex は、全て 16 進の文字かを返す。\nfunc isHex(text string) bool {\n\t// 1 文字ずつ確かめる。\n\tfor _, character := range text {\n\t\tisDigit := character >= '0' && character <= '9'\n\t\tisLower := character >= 'a' && character <= 'f'\n\t\tisUpper := character >= 'A' && character <= 'F'\n\t\tif !isDigit && !isLower && !isUpper {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn text != \"\"\n}\n",
     "stats.go": "// Package launchs_stats は、ingress ごとのアクセスを集計して、一定の間隔で、標準出力に 1 行の JSON として出す Traefik のプラグイン。\n// 標準ライブラリだけを使う(Yaegi で動かすため)。設計は dev-docs/ingress-plugins.md §4。\npackage launchs_stats\n\nimport (\n\t\"context\"\n\t\"encoding/json\"\n\t\"net\"\n\t\"net/http\"\n\t\"os\"\n\t\"strings\"\n\t\"sync\"\n\t\"time\"\n)\n\nconst (\n\t// logPrefix は、出力の行の頭の印。収集側は、この印の行だけを読む。\n\tlogPrefix = \"LAUNCHS_STATS \"\n\t// pathCapacity と clientCapacity は、パスとクライアントを数える枠の数。\n\tpathCapacity   = 100\n\tclientCapacity = 100\n\t// topLimit は、1 回の出力に入れる、パスとクライアントの数。\n\ttopLimit = 50\n\t// maxRequestEntries は、1 回の出力に入れる、1 リクエストごとの記録の数の上限。超えた分は、件数だけ数える。\n\tmaxRequestEntries = 200\n\t// maxURLLength は、記録する URL(パスとクエリ)の長さの上限(バイト)。\n\tmaxURLLength = 1000\n\t// uniqueClientCap は、重複なしのクライアントを数える上限(これを超えたら、数えるのをやめる)。\n\tuniqueClientCap = 10000\n)\n\n// latencyBounds は、応答時間の区切り(ミリ秒)。最後に、それ以上の枠が 1 つ付く。\nvar latencyBounds = []float64{5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000}\n\n// knownMethods は、そのまま数える HTTP メソッド。それ以外は OTHER にまとめる。\nvar knownMethods = map[string]bool{\"GET\": true, \"HEAD\": true, \"POST\": true, \"PUT\": true, \"PATCH\": true, \"DELETE\": true, \"OPTIONS\": true}\n\n// requestEntry は、1 リクエストの記録(アクセスログの 1 行)。\ntype requestEntry struct {\n\t// T は、リクエストを受けた時刻(Unix のミリ秒)。\n\tT int64 `json:\"t\"`\n\t// M は、メソッド。\n\tM string `json:\"m\"`\n\t// U は、URL(パスとクエリ。長すぎれば、切る)。\n\tU string `json:\"u\"`\n\t// S は、ステータス(WebSocket など、包まないものは 0)。\n\tS int `json:\"s\"`\n\t// D は、応答にかかった時間(ミリ秒)。\n\tD float64 `json:\"d\"`\n\t// IP は、クライアントの IP(分からなければ空)。\n\tIP string `json:\"ip\"`\n\t// B は、応答の大きさ(バイト)。\n\tB int64 `json:\"b\"`\n}\n\n// Config は、プラグインの設定。\ntype Config struct {\n\t// IngressID は、集計の宛先の ingress の ID(必須)。\n\tIngressID string `json:\"ingressId,omitempty\"`\n\t// IntervalSeconds は、出力の間隔(秒)。既定は 10。\n\tIntervalSeconds int `json:\"intervalSeconds,omitempty\"`\n\t// ClientIPHeader は、クライアントの IP を読むヘッダー。既定は X-Real-Ip。\n\tClientIPHeader string `json:\"clientIPHeader,omitempty\"`\n}\n\n// CreateConfig は、既定の設定を作る(Traefik が呼ぶ)。\nfunc CreateConfig() *Config {\n\t// 間隔とヘッダーの既定を入れる。\n\treturn &Config{IntervalSeconds: 10, ClientIPHeader: \"X-Real-Ip\"}\n}\n\n// bucket は、1 つの間隔の集計。\ntype bucket struct {\n\tstart      time.Time\n\tcount      int64\n\tstatus     [5]int64\n\tmethods    map[string]int64\n\tbytes      int64\n\tlatency    []int64\n\tsumMs      float64\n\tpaths      *topCounter\n\tclients    *topCounter\n\tuniqueSeen map[string]struct{}\n\tuniqueFull bool\n\t// requests は、1 リクエストごとの記録(上限まで)。requestsDropped は、上限を超えて記録しなかった数。\n\trequests        []requestEntry\n\trequestsDropped int64\n}\n\n// newBucket は、空の集計を作る。\nfunc newBucket(start time.Time) *bucket {\n\t// 各表を空で用意する。\n\treturn &bucket{\n\t\tstart:      start,\n\t\tmethods:    map[string]int64{},\n\t\tlatency:    make([]int64, len(latencyBounds)+1),\n\t\tpaths:      newTopCounter(pathCapacity),\n\t\tclients:    newTopCounter(clientCapacity),\n\t\tuniqueSeen: map[string]struct{}{},\n\t}\n}\n\n// collector は、1 つの ingress ID の集計と、出力のゴルーチンを持つ。\ntype collector struct {\n\tmutex    sync.Mutex\n\tcurrent  *bucket\n\tinterval time.Duration\n\tdone     <-chan struct{}\n}\n\n// registry は、ingress ID ごとの collector を、プロセスの中で 1 つに保つ(設定が読み直されても、出力を二重にしない)。\nvar (\n\tregistryMutex sync.Mutex\n\tregistry      = map[string]*collector{}\n)\n\n// acquireCollector は、ingress ID の collector を返す。無い、または止まっていれば、作って出力を始める。\nfunc acquireCollector(ctx context.Context, ingressID string, interval time.Duration) *collector {\n\t// 登録の表は、排他で触る。\n\tregistryMutex.Lock()\n\tdefer registryMutex.Unlock()\n\t// 生きているものがあれば、それを使う。\n\tif existing, found := registry[ingressID]; found {\n\t\tselect {\n\t\tcase <-existing.done:\n\t\t\t// 止まっているので、作り直す。\n\t\tdefault:\n\t\t\treturn existing\n\t\t}\n\t}\n\t// 新しく作り、出力のゴルーチンを 1 つだけ始める。\n\tcreated := &collector{current: newBucket(time.Now()), interval: interval, done: ctx.Done()}\n\tregistry[ingressID] = created\n\tgo created.run(ingressID)\n\treturn created\n}\n\n// run は、間隔ごとに集計を出力し、ctx が終わったら止まる。\nfunc (target *collector) run(ingressID string) {\n\t// 間隔ごとの時計。\n\tticker := time.NewTicker(target.interval)\n\tdefer ticker.Stop()\n\tfor {\n\t\tselect {\n\t\tcase <-target.done:\n\t\t\treturn\n\t\tcase <-ticker.C:\n\t\t\ttarget.flush(ingressID)\n\t\t}\n\t}\n}\n\n// flush は、今の集計を取り出して(新しい集計に替えて)、出力する。件数 0 なら、何も出さない。\nfunc (target *collector) flush(ingressID string) {\n\t// 集計を差し替える(排他の中は、短く)。\n\ttarget.mutex.Lock()\n\tfinished := target.current\n\ttarget.current = newBucket(time.Now())\n\ttarget.mutex.Unlock()\n\t// 空の間隔は、出さない。\n\tif finished.count == 0 {\n\t\treturn\n\t}\n\t// JSON にして、1 回の書き込みで、1 行を出す。\n\tline, marshalError := json.Marshal(finished.snapshot(ingressID, target.interval))\n\tif marshalError != nil {\n\t\treturn\n\t}\n\t_, _ = os.Stdout.Write(append([]byte(logPrefix), append(line, '\\n')...))\n}\n\n// snapshot は、出力する形にする。\nfunc (finished *bucket) snapshot(ingressID string, interval time.Duration) map[string]any {\n\t// 応答時間の区切りを、数と並べる。\n\treturn map[string]any{\n\t\t\"ingressId\":       ingressID,\n\t\t\"start\":           finished.start.UTC().Format(time.RFC3339),\n\t\t\"intervalSec\":     int(interval / time.Second),\n\t\t\"count\":           finished.count,\n\t\t\"status\":          map[string]int64{\"1xx\": finished.status[0], \"2xx\": finished.status[1], \"3xx\": finished.status[2], \"4xx\": finished.status[3], \"5xx\": finished.status[4]},\n\t\t\"methods\":         finished.methods,\n\t\t\"bytes\":           finished.bytes,\n\t\t\"latencyBounds\":   latencyBounds,\n\t\t\"latency\":         finished.latency,\n\t\t\"sumMs\":           finished.sumMs,\n\t\t\"paths\":           finished.paths.top(topLimit),\n\t\t\"clients\":         finished.clients.top(topLimit),\n\t\t\"uniqueClients\":   len(finished.uniqueSeen),\n\t\t\"uniqueCapped\":    finished.uniqueFull,\n\t\t\"requests\":        finished.requests,\n\t\t\"requestsDropped\": finished.requestsDropped,\n\t}\n}\n\n// record は、1 回のアクセスを集計に足す。\nfunc (target *collector) record(method, path, rawURL, client string, started time.Time, status int, written int64, elapsed time.Duration) {\n\t// 集計は排他で触る。\n\ttarget.mutex.Lock()\n\tdefer target.mutex.Unlock()\n\tcurrent := target.current\n\tcurrent.count++\n\t// ステータスを、百の位でまとめる。\n\tif status >= 100 && status < 600 {\n\t\tcurrent.status[status/100-1]++\n\t}\n\t// メソッドは、知っているものだけ(それ以外は、集計では OTHER)。\n\taggregateMethod := method\n\tif !knownMethods[aggregateMethod] {\n\t\taggregateMethod = \"OTHER\"\n\t}\n\tcurrent.methods[aggregateMethod]++\n\tcurrent.bytes += written\n\t// 応答時間を、区切りに入れる。\n\tmilliseconds := float64(elapsed) / float64(time.Millisecond)\n\tcurrent.sumMs += milliseconds\n\tslot := len(latencyBounds)\n\tfor index, bound := range latencyBounds {\n\t\tif milliseconds <= bound {\n\t\t\tslot = index\n\t\t\tbreak\n\t\t}\n\t}\n\tcurrent.latency[slot]++\n\t// 1 リクエストの記録を残す(上限を超えたら、数だけ数える)。\n\tif len(current.requests) < maxRequestEntries {\n\t\tif len(rawURL) > maxURLLength {\n\t\t\trawURL = rawURL[:maxURLLength]\n\t\t}\n\t\tcurrent.requests = append(current.requests, requestEntry{T: started.UnixMilli(), M: method, U: rawURL, S: status, D: float64(int64(milliseconds*100)) / 100, IP: client, B: written})\n\t} else {\n\t\tcurrent.requestsDropped++\n\t}\n\t// パスを数える。\n\tcurrent.paths.add(normalizePath(path))\n\t// クライアントを数える(IP が分からなければ、数えない)。\n\tif client != \"\" {\n\t\tcurrent.clients.add(client)\n\t\tif _, seen := current.uniqueSeen[client]; !seen {\n\t\t\tif len(current.uniqueSeen) < uniqueClientCap {\n\t\t\t\tcurrent.uniqueSeen[client] = struct{}{}\n\t\t\t} else {\n\t\t\t\tcurrent.uniqueFull = true\n\t\t\t}\n\t\t}\n\t}\n}\n\n// Stats は、集計のミドルウェア。\ntype Stats struct {\n\tnext      http.Handler\n\tcollector *collector\n\theader    string\n}\n\n// New は、ミドルウェアを作る(Traefik が呼ぶ)。\nfunc New(ctx context.Context, next http.Handler, config *Config, name string) (http.Handler, error) {\n\t// 設定が無い、または ID が空なら、何も集計せず、素通しにする。\n\tif config == nil || config.IngressID == \"\" {\n\t\treturn next, nil\n\t}\n\t// 間隔とヘッダーの既定を補う。\n\tseconds := config.IntervalSeconds\n\tif seconds <= 0 {\n\t\tseconds = 10\n\t}\n\theader := config.ClientIPHeader\n\tif header == \"\" {\n\t\theader = \"X-Real-Ip\"\n\t}\n\treturn &Stats{next: next, collector: acquireCollector(ctx, config.IngressID, time.Duration(seconds)*time.Second), header: header}, nil\n}\n\n// ServeHTTP は、リクエストを下に渡し、終わったら集計に足す。失敗しても、アクセスは止めない。\nfunc (stats *Stats) ServeHTTP(rw http.ResponseWriter, req *http.Request) {\n\t// 始めた時刻と、クライアントの IP を取る。\n\tstarted := time.Now()\n\tclient := stats.clientOf(req)\n\t// WebSocket と、イベントストリームは、包まない(Yaegi の包みが Flush を通さないため)。接続の開始だけ数える。\n\tif isUpgrade(req) || strings.Contains(req.Header.Get(\"Accept\"), \"text/event-stream\") {\n\t\tstats.next.ServeHTTP(rw, req)\n\t\tstats.safeRecord(req, client, started, 0, 0, time.Since(started))\n\t\treturn\n\t}\n\t// 応答を包んで、ステータスと大きさを知る。\n\twrapped := &recorder{ResponseWriter: rw, status: http.StatusOK}\n\tstats.next.ServeHTTP(wrapped, req)\n\tstats.safeRecord(req, client, started, wrapped.status, wrapped.bytes, time.Since(started))\n}\n\n// safeRecord は、panic を握りつぶして、集計に足す。\nfunc (stats *Stats) safeRecord(req *http.Request, client string, started time.Time, status int, written int64, elapsed time.Duration) {\n\t// 集計の失敗で、アクセスを止めない。\n\tdefer func() { _ = recover() }()\n\tstats.collector.record(req.Method, req.URL.Path, req.URL.RequestURI(), client, started, status, written, elapsed)\n}\n\n// clientOf は、設定のヘッダーからクライアントの IP を読む。無ければ、接続元の IP。\nfunc (stats *Stats) clientOf(req *http.Request) string {\n\t// ヘッダーの値(最初の要素)。\n\tvalue := strings.TrimSpace(strings.Split(req.Header.Get(stats.header), \",\")[0])\n\tif net.ParseIP(value) != nil {\n\t\treturn value\n\t}\n\t// 無ければ、接続元。\n\thost, _, splitError := net.SplitHostPort(req.RemoteAddr)\n\tif splitError == nil && net.ParseIP(host) != nil {\n\t\treturn host\n\t}\n\treturn \"\"\n}\n\n// isUpgrade は、接続の切り替え(WebSocket など)の要求かを返す。\nfunc isUpgrade(req *http.Request) bool {\n\t// Upgrade ヘッダーがあれば、そう。\n\treturn req.Header.Get(\"Upgrade\") != \"\"\n}\n\n// recorder は、ステータスと書いたバイト数を覚える包み。\ntype recorder struct {\n\thttp.ResponseWriter\n\tstatus      int\n\tbytes       int64\n\twroteHeader bool\n}\n\n// WriteHeader は、ステータスを覚えて、下に渡す。\nfunc (rec *recorder) WriteHeader(code int) {\n\t// 最初の 1 回だけ覚える。\n\tif !rec.wroteHeader {\n\t\trec.status = code\n\t\trec.wroteHeader = true\n\t}\n\trec.ResponseWriter.WriteHeader(code)\n}\n\n// Write は、書いたバイト数を足して、下に渡す。\nfunc (rec *recorder) Write(data []byte) (int, error) {\n\t// ヘッダーを書いていなければ、200 として記録済み。\n\trec.wroteHeader = true\n\twritten, writeError := rec.ResponseWriter.Write(data)\n\trec.bytes += int64(written)\n\treturn written, writeError\n}\n\n// Unwrap は、下の応答を返す(ResponseController 用)。\nfunc (rec *recorder) Unwrap() http.ResponseWriter {\n\treturn rec.ResponseWriter\n}\n",
     "topn.go": "package launchs_stats\n\nimport \"sort\"\n\n// counted は、キーと、その数(上位の集計の 1 行)。\ntype counted struct {\n\tKey   string `json:\"key\"`\n\tCount int64  `json:\"count\"`\n}\n\n// topCounter は、Space-Saving 法で、よく出るキーを、決まった数の枠だけで数える。\n// 枠が一杯のとき、新しいキーは、最も小さい枠を奪う(数は、奪った枠の数 + 1)。メモリは、枠の数で上限が決まる。\ntype topCounter struct {\n\t// capacity は、枠の数。\n\tcapacity int\n\t// counts は、キーごとの数。\n\tcounts map[string]int64\n}\n\n// newTopCounter は、枠の数を指定して、数えるものを作る。\nfunc newTopCounter(capacity int) *topCounter {\n\t// 空の表を持つ。\n\treturn &topCounter{capacity: capacity, counts: make(map[string]int64, capacity)}\n}\n\n// add は、キーを 1 回数える。\nfunc (counter *topCounter) add(key string) {\n\t// 既にある枠なら、足すだけ。\n\tif _, found := counter.counts[key]; found {\n\t\tcounter.counts[key]++\n\t\treturn\n\t}\n\t// 空きがあれば、新しい枠を使う。\n\tif len(counter.counts) < counter.capacity {\n\t\tcounter.counts[key] = 1\n\t\treturn\n\t}\n\t// 一杯なら、最も小さい枠を探して、奪う。\n\tminKey := \"\"\n\tminCount := int64(-1)\n\tfor existing, count := range counter.counts {\n\t\tif minCount < 0 || count < minCount || (count == minCount && existing < minKey) {\n\t\t\tminKey = existing\n\t\t\tminCount = count\n\t\t}\n\t}\n\tdelete(counter.counts, minKey)\n\tcounter.counts[key] = minCount + 1\n}\n\n// top は、数の多い順(同じ数ならキーの昇順)に、上位 limit 個を返す。\nfunc (counter *topCounter) top(limit int) []counted {\n\t// 全ての枠を並べる。\n\tresult := make([]counted, 0, len(counter.counts))\n\tfor key, count := range counter.counts {\n\t\tresult = append(result, counted{Key: key, Count: count})\n\t}\n\tsort.Slice(result, func(left, right int) bool {\n\t\tif result[left].Count != result[right].Count {\n\t\t\treturn result[left].Count > result[right].Count\n\t\t}\n\t\treturn result[left].Key < result[right].Key\n\t})\n\t// 上位だけに切る。\n\tif len(result) > limit {\n\t\tresult = result[:limit]\n\t}\n\treturn result\n}\n"
    }
   }
