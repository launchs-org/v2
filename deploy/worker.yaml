# Temporal のワーカー。プロジェクトの namespace、deploy、service、ingress などを、k8s に作る・消す(権限は rbac.yaml)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: launchs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        admission.datadoghq.com/enabled: "false"
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: ghcr.io/launchs-org/v2/worker:latest
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: launchs-secret, key: POSTGRES_PASSWORD}
            - name: DATABASE_URL
              value: postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/app?sslmode=disable
            # 同じクラスターの中の k8s に、ServiceAccount でつなぐ。
            - name: KUBERNETES_ACCESS
              value: in-cluster
          envFrom:
            - configMapRef:
                name: launchs-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
