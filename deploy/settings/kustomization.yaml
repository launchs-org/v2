# 秘密(Secret)。Git に入れない(secret.yaml は gitignore。secret.example.yaml をコピーして作る)。
#
#   kubectl apply -k settings/        # deploy/ で
#
# 環境ごとの設定(ConfigMap launchs-config)は、本体(deploy/kustomization.yaml)に含まれる(settings/config.yaml)。Argo CD の kustomize.patches で、上書きできる(../argocd.md)。
# 先に namespace `launchs` が要る(本体の namespace.yaml。手順は ../argocd.md)。
# secret.example.yaml(雛形)は、placeholder の値が入っているので、ここには含めない(誤って適用しない)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret.yaml
