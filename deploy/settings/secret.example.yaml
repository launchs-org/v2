# 秘密の雛形。`cp secret.example.yaml secret.yaml` して、値を入れてから、`kubectl apply -k .`(この settings/ で)する。本体(`deploy/` の `kubectl apply -k .`)とは、別に適用する。
# secret.yaml は、gitignore してある(リポジトリには置かない)。
#
# POSTGRES_PASSWORD は、英数字だけにする(DB の接続 URL にそのまま入れるため)。例: openssl rand -hex 24
apiVersion: v1
kind: Secret
metadata:
  name: launchs-secret
  namespace: launchs
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_hex"
  # API トークン(機械向けの JWT)の署名の秘密(HS512)。64 文字以上。生成: openssl rand -hex 64
  # 変えると、発行済みの API トークンが、全て使えなくなる。
  API_TOKEN_SECRET: "CHANGE_ME_hex_64bytes_or_more"
  # アクセスログの転送(webhook と Google Drive。dev-docs/log-export.md)。無ければ、その機能は無効(Pod は、起動する)。
  # EXPORT_CREDENTIAL_KEY: 秘密(Google の合鍵、webhook の署名の秘密)を DB に暗号化して保存する鍵。生成: openssl rand -base64 32
  #   **変えると、保存済みの秘密を、復号できなくなる**(Google の再接続と、webhook の作り直しが、要る)。
  # GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET: Google Cloud の OAuth クライアント(種類は Web アプリ。
  #   リダイレクト URI は https://<LAUNCHS_HOST>/api/v1/export/google/callback。同意の画面は「本番」に公開する)。
  EXPORT_CREDENTIAL_KEY: ""
  GOOGLE_OAUTH_CLIENT_ID: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  # 最初の管理者(auth が、起動時に、管理者が 1 人もいなければ作る。作ったあとは、パスワードを消してよい)。
  AUTH_BOOTSTRAP_ADMIN_NAME: "admin"
  AUTH_BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_long_random_password"
  # 人間であることの確認(Cloudflare Turnstile)。両方を入れたときだけ有効(空なら無効)。
  AUTH_TURNSTILE_SITE_KEY: ""
  AUTH_TURNSTILE_SECRET_KEY: ""
---
# access token の署名鍵(Ed25519 の PEM。ファイル名の .pem より前が kid)。生成: openssl genpkey -algorithm ed25519
# 鍵を替えるときは、新しい鍵(別の kid)を足して、AUTH_ACTIVE_KID を切り替える(古い鍵は、トークンの期限が切れるまで残す)。
apiVersion: v1
kind: Secret
metadata:
  name: launchs-auth-keys
  namespace: launchs
type: Opaque
stringData:
  key-1.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_openssl_genpkey_-algorithm_ed25519_OUTPUT
    -----END PRIVATE KEY-----
