# 認証(ユーザーの登録・ログイン・トークンの発行と、公開鍵 JWKS の配信)。URL は /auth/...(パスを書き換えずに渡す)。
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: launchs
spec:
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: launchs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        admission.datadoghq.com/enabled: "false"
    spec:
      initContainers:
        # auth データベースのマイグレーション(up だけ。何度流しても、変わらない)。
        - name: migrate
          image: ghcr.io/launchs-org/v2/migrate:latest
          args: ["-path=/migrations/auth", "-database=postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/auth?sslmode=disable", "up"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: launchs-secret, key: POSTGRES_PASSWORD}
      containers:
        - name: auth
          image: ghcr.io/launchs-org/v2/auth:latest
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: launchs-secret, key: POSTGRES_PASSWORD}
            - name: DATABASE_URL
              value: postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/auth?sslmode=disable
            # 署名鍵は、Secret をマウントする(本番では、自動生成しない)。
            - name: AUTH_KEYS_DIR
              value: /keys
            - name: AUTH_KEYS_AUTOGENERATE
              value: "false"
          envFrom:
            - configMapRef:
                name: launchs-config
                optional: false
            - secretRef:
                name: launchs-secret
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: keys, mountPath: /keys, readOnly: true}
      volumes:
        - name: keys
          secret:
            secretName: launchs-auth-keys
