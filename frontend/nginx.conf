# 本番用の静的配信の設定。/api と /auth は、Traefik が backend と auth へ振り分けるので、ここには来ない。
server {
    listen 80;
    root /usr/share/nginx/html;

    # セキュリティのヘッダ。refresh token を localStorage に置くので、外のスクリプトと、インラインのスクリプトを、全て禁止する
    # (Vite のビルドは、外部ファイルの JS と CSS だけを作る)。API は、同じオリジン(/api、/auth)。
    # add_header は、location に add_header があると、server の分が引き継がれないので、各 location で include する。
    include /etc/nginx/conf.d/security-headers.inc;

    # ハッシュつきのファイルは、長く保存してよい。
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # それ以外は、SPA の入口(index.html)。ブラウザに、保存させない(新しいビルドにすぐ切り替えるため)。
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
