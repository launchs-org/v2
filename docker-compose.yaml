services:
  # API サーバー。ホストには公開せず、コンテナネットワークの中だけに置く。入り口は nginx。
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
      target: Develop
    tty: true
    volumes:
      - .:/app
      - go-module-cache:/go/pkg/mod

  # 開発用の自己署名の証明書を作る。1回だけ実行して終わる(すでにあれば何もしない)。
  nginx-certificate:
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "/dev-nginx/generate-certificate.sh"]
    volumes:
      - ./dev/nginx:/dev-nginx:ro
      - nginx-certificates:/certs

  # HTTPS を終端するリバースプロキシ。コンテナネットワークの中で、バックエンドへ HTTP でプロキシする。
  nginx:
    image: nginx:1.31.8-alpine
    depends_on:
      nginx-certificate:
        condition: service_completed_successfully
      backend:
        condition: service_started
    ports:
      # 手元から呼ぶためのポート。他のものと重なることがあるので、既定は 18443 にして、
      # HTTPS_HOST_PORT で変えられるようにしてある。
      - "127.0.0.1:${HTTPS_HOST_PORT:-18443}:443"
    volumes:
      - ./dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certificates:/etc/nginx/certs:ro

volumes:
  go-module-cache:
  postgres-data:
  nginx-certificates:
