services:
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
      target: Develop
    tty: true
    volumes:
      - .:/app
      - go-module-cache:/go/pkg/mod

  # 開発環境の PostgreSQL。1つのサーバーの中に、app、auth、temporal の各データベースを作る。
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dev/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  go-module-cache:
  postgres-data:
