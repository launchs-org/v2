# nginx で静的なページを公開する。サーバーの設定(default.conf)とページ(index.html)と、バイナリの画像(favicon)を、files/ に置き、共有の ConfigMap として渡す。
apiVersion: launchs/v1
kind: Template
metadata:
  id: nginx
  name: nginx(静的なページ)
  description: nginx で、簡単なページを公開します。設定ファイルとページは、ConfigMap で管理され、あとから編集できます。
  icon: globe
  category: web

variables:
  - name: title
    label: ページの題
    type: string
    default: Hello, Launchs!
    maxLength: 100
  - name: gzip
    label: 圧縮(gzip)
    type: choice
    default: "on"
    options:
      - value: "on"
        label: 有効
      - value: "off"
        label: 無効

resources:
  - kind: configmap
    name: site
    files:
      - key: default.conf       # フォルダのファイルを読む(text は ${...} を展開する)
        from: files/default.conf
      - key: index.html
        from: files/index.html
      - key: favicon.gif        # バイナリは、自動で判定して、そのまま渡す(base64 を手で書かない)
        from: files/favicon.gif

  - kind: deploy
    name: web
    image: nginx:alpine
    spec: small
    replicas: 1
    configmaps:
      - configmap: site
        key: default.conf
        path: /etc/nginx/conf.d/default.conf
      - configmap: site
        key: index.html
        path: /usr/share/nginx/html/index.html
      - configmap: site
        key: favicon.gif
        path: /usr/share/nginx/html/favicon.gif
    service:
      ports:
        - name: http
          port: 80
          protocol: tcp

  - kind: ingress
    rules:
      - path: /
        deploy: web
        port: 80
