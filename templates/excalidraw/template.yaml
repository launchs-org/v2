# Excalidraw(ホワイトボード)。データを持たない(絵は、ブラウザの中と、ファイルに保存する)ので、ボリュームは要らない。
apiVersion: launchs/v1
kind: Template
metadata:
  id: excalidraw
  name: Excalidraw(ホワイトボード)
  description: 手書き風の図やメモを、ブラウザで描けます。保存するデータはなく、すぐ使えます。
  icon: draw
  category: tool
  notes: |
    公開 URL を開くと、そのまま描けます。描いた絵は、サーバーには保存されません。「ファイルに保存」で、手元に書き出してください。
    この URL を知っている人は、誰でも開けます(ログインはありません)。

resources:
  - kind: deploy
    name: board
    image: excalidraw/excalidraw:latest
    spec: small
    replicas: 1
    service:
      ports:
        - name: http
          port: 80
          protocol: tcp

  - kind: ingress
    rules:
      - path: /
        deploy: board
        port: 80
