# Grafana(グラフの画面)。管理者のパスワードは自動で作る。データ(ダッシュボードの設定)は、ボリュームに保存する。
apiVersion: launchs/v1
kind: Template
metadata:
  id: grafana
  name: Grafana(グラフの画面)
  description: データベースや監視のデータを、グラフにして見られます。ダッシュボードを作って、共有できます。
  icon: chart
  category: monitoring
  notes: |
    1. 公開 URL を開いて、ユーザー名 admin と、下の「作成した値」のパスワードで、ログインします。
    2. 最初のログインのあと、パスワードを変えるよう案内されます(変えなくても使えます)。
    3. 左のメニューの「Connections」→「Data sources」で、見たいデータ(PostgreSQL、MySQL など)を、つなぎます。同じプロジェクトのデータベースは、その Service の DNS 名(デプロイの「Service」タブ)で、つなげます。

variables:
  - name: password
    label: 管理者(admin)のパスワード
    type: password
    generate: true
    length: 20
  - name: storage
    label: データの大きさ(MB)
    type: integer
    default: "1024"
    min: 256
    max: 5120

resources:
  - kind: volume
    name: data
    sizeMB: ${storage}

  - kind: deploy
    name: grafana
    image: grafana/grafana-oss:latest
    spec: medium
    replicas: 1
    # イメージは、ユーザー 472 で動く。ボリュームに書けるよう、所有グループを 472 にする。
    fsGroup: 472
    env:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    mounts:
      - volume: data
        path: /var/lib/grafana
    service:
      ports:
        - name: http
          port: 3000
          protocol: tcp

  - kind: ingress
    rules:
      - path: /
        deploy: grafana
        port: 3000
