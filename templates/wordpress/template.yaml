# WordPress(web + MariaDB)。2 つの deploy を、service の DNS 名でつなぐ。データベースとアップロードしたファイルは、ボリュームに保存する。
apiVersion: launchs/v1
kind: Template
metadata:
  id: wordpress
  name: WordPress
  description: ブログ・サイトを作れる WordPress。データベース(MariaDB)と、アップロードしたファイルは、ボリュームに保存されます。
  icon: globe
  category: web

variables:
  - name: db_password
    label: データベースのパスワード
    type: password
    generate: true
    length: 24
  - name: db_storage
    label: データベースの大きさ(MB)
    type: integer
    default: "1024"
    min: 256
    max: 5120
  - name: content_storage
    label: アップロードの置き場の大きさ(MB)
    type: integer
    default: "1024"
    min: 256
    max: 5120

resources:
  - kind: volume
    name: dbdata
    sizeMB: ${db_storage}

  - kind: volume
    name: content
    sizeMB: ${content_storage}

  # web を先に書いても、db の service が先に作られる(${service.db.dns} の参照に従う)。
  - kind: deploy
    name: web
    image: wordpress:6
    spec: medium
    replicas: 1
    env:
      WORDPRESS_DB_HOST: ${service.db.dns}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${db_password}
    mounts:
      - volume: content
        path: /var/www/html/wp-content
    service:
      ports:
        - name: http
          port: 80
          protocol: tcp

  - kind: deploy
    name: db
    image: mariadb:11
    spec: medium
    replicas: 1
    env:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${db_password}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    mounts:
      - volume: dbdata
        path: /var/lib/mysql
    service:
      ports:
        - name: mysql
          port: 3306
          protocol: tcp

  - kind: ingress
    rules:
      - path: /
        deploy: web
        port: 80
