# Mailpit(開発用のメール受信箱)。アプリが送ったメールを、実際には送らずに、受け取って、画面で見せる。
# 画面(HTTP)は、パスワードで守って公開する。メールを受け取る口(SMTP の 1025 番)は、インターネットには公開せず、同じプロジェクトの中のアプリだけが使う。
apiVersion: launchs/v1
kind: Template
metadata:
  id: mailpit
  name: Mailpit(開発用のメール受信箱)
  description: 開発中のアプリが送るメールを、本物の宛先に送らずに、受け取って、画面で確認できます。
  icon: mail
  category: dev
  notes: |
    1. 公開 URL を開いて、ユーザー名 admin と、「作成した値」のパスワードで、ログインします。受け取ったメールが、一覧に出ます。
    2. メールを送るアプリには、SMTP サーバーとして、Mailpit の Service の DNS 名(デプロイの「Service」タブ)と、ポート 1025 を設定します。同じプロジェクトのアプリだけが、使えます。認証と暗号化は、要りません。
    メールは、本物の宛先には、届きません(ここで受け取るだけです)。

variables:
  - name: password
    label: 画面のパスワード(ユーザー名は admin)
    type: password
    generate: true
    length: 20
  - name: storage
    label: データの大きさ(MB)
    type: integer
    default: "512"
    min: 128
    max: 5120

resources:
  - kind: volume
    name: data
    sizeMB: ${storage}

  - kind: deploy
    name: mailpit
    image: axllent/mailpit:latest
    spec: small
    replicas: 1
    env:
      MP_UI_AUTH: admin:${password}
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    mounts:
      - volume: data
        path: /data
    service:
      ports:
        - name: http
          port: 8025
          protocol: tcp
        - name: smtp
          port: 1025
          protocol: tcp

  - kind: ingress
    rules:
      - path: /
        deploy: mailpit
        port: 8025
