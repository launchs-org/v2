# MariaDB 11。データは、ボリュームに保存する。クラスターの中からだけ、使える(外には、公開しない)。
apiVersion: launchs/v1
kind: Template
metadata:
  id: mariadb
  name: MariaDB
  description: データベース(MariaDB 11)。データは、ボリュームに保存されます。
  icon: database
  category: database

variables:
  - name: database
    label: データベース名
    type: string
    default: app
    pattern: "^[a-z][a-z0-9_]{0,30}$"
  - name: user
    label: ユーザー名
    type: string
    default: app
    pattern: "^[a-z][a-z0-9_]{0,30}$"
  - name: password
    label: パスワード
    type: password
    generate: true
    length: 24
  - name: storage
    label: ボリュームの大きさ(MB)
    type: integer
    default: "1024"
    min: 256
    max: 5120

resources:
  - kind: volume
    name: data
    sizeMB: ${storage}

  - kind: deploy
    name: db
    image: mariadb:11
    spec: medium
    replicas: 1
    env:
      MARIADB_DATABASE: ${database}
      MARIADB_USER: ${user}
      MARIADB_PASSWORD: ${password}
      # root のパスワードは、ランダムに作る(利用者は、作った一般ユーザーで、つなぐ)。
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    mounts:
      - volume: data
        path: /var/lib/mysql
    service:
      ports:
        - name: mysql
          port: 3306
          protocol: tcp
