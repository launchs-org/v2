# Uptime Kuma(サイトの死活監視と、状態ページ)。データ(監視の設定と履歴)は、ボリュームに保存する。
apiVersion: launchs/v1
kind: Template
metadata:
  id: uptime-kuma
  name: Uptime Kuma(死活監視)
  description: サイトやサービスが動いているかを、定期的に確かめて、止まったら知らせてくれます。状態ページも作れます。
  icon: activity
  category: monitoring
  notes: |
    1. 公開 URL を開くと、管理者のアカウントを作る画面が出ます。最初に開いた人が管理者になるので、作成が終わったら、すぐ開いて、作ってください。
    2. ログインしたら、「監視を追加」から、見張りたい URL を入れます。
    3. 通知(メール、Slack など)は、右上のメニューの「設定」→「通知」で、足せます。

variables:
  - name: storage
    label: データの大きさ(MB)
    type: integer
    default: "1024"
    min: 256
    max: 5120

resources:
  - kind: volume
    name: data
    sizeMB: ${storage}

  - kind: deploy
    name: kuma
    image: louislam/uptime-kuma:1
    spec: medium
    replicas: 1
    mounts:
      - volume: data
        path: /app/data
    service:
      ports:
        - name: http
          port: 3001
          protocol: tcp

  - kind: ingress
    rules:
      - path: /
        deploy: kuma
        port: 3001
